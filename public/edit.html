<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <nav>
        <a href="/"><h1>Food API</h1></a>
    </nav>
    <main>
    <form id="form_input">
        <label>Name</label>
        <input type="text">
        <label>Stock</label>
        <input type="text">
        <label>Type</label>
        <select name="" id="">
            <option value="food">Food</option>
            <option value="drink">Drink</option>
        </select>
        <br>
        <button type="submit">Submit</button>
    </form>
    <div class="right">
        <h1>Update Data:</h1>
        <h1></h1>
    </div>
    </main>
</body>
<script>
const form = document.querySelector("#form_input");
const right = document.querySelector(".right");
const name = new URLSearchParams(window.location.search).get("name")

right.children[1].innerHTML = name

fetch(`/api/${name}`)
.then(res => res.json())
.then(data => {
    form.children[1].value = data[0].name
    form.children[3].value = data[0].stock
    form.children[5].value = data[0].type
})

form.addEventListener("submit", (e) => {
    e.preventDefault();

    var nama = e.target[0].value
    var stok = e.target[1].value
    var tipe = e.target[2].value
    if (confirm("Are you sure?"))
    {
        fetch(`/update`, {method:"put", headers:{"Content-Type":"application/json"}, body:JSON.stringify({nama, stok, tipe})})
        .then(res => console.log(res))
        window.location.href = "/"
    } 
})



</script>
</html>
